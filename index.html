<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Registro de Conchas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#161616;
    --panel-2:#1f1f1f;
    --line:#2a2a2a;
    --ink:#f5f5f0;
    --mute:#8a8a85;
    --ore:#d4a017;
    --ore-dk:#7a5a0c;
    --waste:#6a6a6a;
    --waste-dk:#3a3a3a;
    --go:#2d7a4a;
    --warn:#c44;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{background:var(--bg);color:var(--ink);font-family:'Barlow',sans-serif;min-height:100vh;overscroll-behavior:none}
  body{
    background:
      radial-gradient(1200px 600px at 50% -200px, rgba(212,160,23,0.06), transparent 60%),
      var(--bg);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}

  .brand{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 4px 18px;border-bottom:1px solid var(--line);margin-bottom:18px;
  }
  .brand-mark{display:flex;align-items:center;gap:10px}
  .brand-dot{width:10px;height:10px;background:var(--ore);border-radius:50%;box-shadow:0 0 12px var(--ore)}
  .brand-name{font-weight:900;letter-spacing:2px;text-transform:uppercase;font-size:14px}
  .brand-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute);letter-spacing:1px;text-transform:uppercase}

  h1{font-weight:900;font-size:38px;line-height:1;letter-spacing:-1px;text-transform:uppercase;margin-bottom:6px}
  h1 span{color:var(--ore)}
  .sub{color:var(--mute);font-size:14px;letter-spacing:0.5px;margin-bottom:22px}

  .operator{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;
  }
  .operator-label{font-size:10px;letter-spacing:2px;color:var(--mute);text-transform:uppercase;font-weight:700}
  .operator-name{font-size:20px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
  .operator-name.empty{color:var(--mute);font-weight:500;font-style:italic}
  .btn-edit{
    background:transparent;border:1px solid var(--line);color:var(--ink);
    padding:8px 14px;border-radius:8px;font-family:inherit;font-size:12px;
    font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;
  }
  .btn-edit:active{background:var(--panel-2)}

  .counters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
  .counter-sub{font-size:10px;letter-spacing:1.5px;color:var(--mute);text-transform:uppercase;font-weight:700;margin-top:4px}
  .counter{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px 14px;position:relative;overflow:hidden;
  }
  .counter::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
  .counter.waste::before{background:var(--waste)}
  .counter.ore::before{background:var(--ore)}
  .counter-label{font-size:10px;letter-spacing:2px;color:var(--mute);text-transform:uppercase;font-weight:800}
  .counter-value{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:44px;
    line-height:1;margin-top:8px;letter-spacing:-2px;
  }
  .counter.ore .counter-value{color:var(--ore)}

  .capture{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
  .btn-cap{
    position:relative;padding:30px 20px;border:none;border-radius:16px;
    font-family:inherit;font-weight:900;font-size:30px;letter-spacing:3px;
    text-transform:uppercase;color:#fff;cursor:pointer;
    box-shadow:0 8px 28px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    transition:transform 0.08s ease, box-shadow 0.08s ease;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    overflow:hidden;
  }
  .btn-cap:active{transform:translateY(2px);box-shadow:0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1)}
  .btn-cap .txt{text-align:left;line-height:0.95}
  .btn-cap .ico{
    width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,0.3);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    border:2px solid rgba(255,255,255,0.25);
  }
  .btn-cap .ico svg{width:26px;height:26px;fill:#fff}
  .btn-waste{background:linear-gradient(135deg,#5a5a5a 0%, #2a2a2a 100%)}
  .btn-waste::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      repeating-linear-gradient(45deg, transparent 0 14px, rgba(0,0,0,0.08) 14px 15px);
  }
  .btn-ore{background:linear-gradient(135deg, #e6b320 0%, #8b6914 100%)}
  .btn-ore::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.12), transparent 40%);
  }

  .last{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:10px;margin-bottom:18px;display:none;align-items:center;gap:12px;
    animation:slidein 0.25s ease;
  }
  .last.show{display:flex}
  .last img{width:66px;height:66px;object-fit:cover;border-radius:10px;background:#000}
  .last-info{flex:1;min-width:0}
  .last-tag{
    display:inline-block;font-size:10px;letter-spacing:2px;font-weight:800;
    padding:3px 8px;border-radius:4px;text-transform:uppercase;
  }
  .last-tag.waste{background:#3a3a3a;color:#ddd}
  .last-tag.ore{background:var(--ore);color:#2a1e00}
  .last-time{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--mute);margin-top:6px}
  .btn-undo{
    background:transparent;border:1px solid var(--line);color:var(--mute);
    padding:8px 10px;border-radius:8px;font-family:inherit;font-size:11px;
    font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;
  }
  .btn-undo:active{color:var(--warn);border-color:var(--warn)}

  .btn-export{
    width:100%;padding:22px;border:none;border-radius:14px;
    background:linear-gradient(135deg, #2d7a4a, #1f5433);
    color:#fff;font-family:inherit;font-size:22px;font-weight:800;letter-spacing:2px;
    text-transform:uppercase;cursor:pointer;
    box-shadow:0 6px 22px rgba(45,122,74,0.35);
    display:flex;align-items:center;justify-content:center;gap:12px;
  }
  .btn-export:active{transform:translateY(1px)}
  .btn-export:disabled{background:#222;color:#555;box-shadow:none;cursor:not-allowed}
  .btn-export svg{width:22px;height:22px;fill:currentColor}

  .clear{
    width:100%;padding:12px;border:none;background:transparent;color:var(--mute);
    font-family:inherit;font-size:11px;letter-spacing:2px;text-transform:uppercase;
    font-weight:700;margin-top:16px;cursor:pointer;
  }
  .clear:active{color:var(--warn)}

  .status{text-align:center;padding:12px;color:var(--mute);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-family:'JetBrains Mono',monospace}

  input[type=file]{display:none}

  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px);
    display:flex;align-items:flex-end;justify-content:center;z-index:100;
    animation:fadein 0.2s ease;
  }
  .modal{
    background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:24px 20px 32px;width:100%;max-width:520px;
    animation:slideup 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .modal-handle{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 18px}
  .modal h2{font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px}
  .modal input[type=text]{
    width:100%;padding:16px;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font-family:inherit;font-size:18px;margin-bottom:16px;outline:none;
  }
  .modal input[type=text]:focus{border-color:var(--ore)}
  .modal-actions{display:flex;gap:10px}
  .modal-actions button{
    flex:1;padding:16px;border:none;border-radius:10px;font-family:inherit;
    font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  }
  .btn-go{background:var(--ore);color:#2a1e00}
  .btn-no{background:var(--panel-2);color:var(--ink)}

  .toast{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--line);padding:12px 18px;
    border-radius:10px;font-size:14px;font-weight:600;z-index:200;
    opacity:0;pointer-events:none;transition:opacity 0.2s;
    box-shadow:0 6px 20px rgba(0,0,0,0.5);
  }
  .toast.show{opacity:1}
  .toast.ok{border-color:var(--go)}
  .toast.err{border-color:var(--warn)}

  .btn-subtype{
    flex:1;padding:22px 10px;border:none;border-radius:12px;font-family:inherit;
    font-size:18px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .btn-subtype .sub-kg{font-size:12px;font-weight:600;letter-spacing:1px;opacity:0.75}
  .btn-brita{background:linear-gradient(135deg,#e6b320,#8b6914);color:#2a1e00}
  .btn-bloco{background:linear-gradient(135deg,#5a8a3a,#2a5a1a);color:#fff}

  @keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="brand-mark">
      <div class="brand-dot"></div>
      <div class="brand-name">Campo · Pátio</div>
    </div>
    <div class="brand-date" id="dateTop">—</div>
  </div>

  <h1>Registro<br><span>de conchas</span></h1>
  <div class="sub">Bata a foto · classifique · exporte</div>

  <div class="operator">
    <div>
      <div class="operator-label">Catador</div>
      <div class="operator-name empty" id="opName">não informado</div>
    </div>
    <button class="btn-edit" onclick="editOp()">Trocar</button>
  </div>

  <div class="counters">
    <div class="counter waste">
      <div class="counter-label">Estéril</div>
      <div class="counter-value" id="cE">00</div>
    </div>
    <div class="counter ore">
      <div class="counter-label">Minério</div>
      <div class="counter-value" id="cM">00</div>
      <div class="counter-sub">Brita: <span id="cBrita">0</span> · Bloco: <span id="cBloco">0</span></div>
    </div>
  </div>

  <div class="capture">
    <button class="btn-cap btn-waste" onclick="snap('esteril')">
      <div class="txt">Estéril</div>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M9 2h6l1 2h4v2H4V4h4l1-2zm1 6h4l-.5 12h-3L10 8zm-4 0h2l.5 12H6V8zm10 0h2v12h-2.5L16 8z"/></svg></div>
    </button>
    <button class="btn-cap btn-ore" onclick="snap('minerio')">
      <div class="txt">Minério</div>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 2L2 8v8l10 6 10-6V8L12 2zm0 2.3L19.5 9 12 13.5 4.5 9 12 4.3zM4 10.5l7 4.2v6.6l-7-4.2v-6.6zm16 0v6.6l-7 4.2v-6.6l7-4.2z"/></svg></div>
    </button>
  </div>

  <div class="last" id="last">
    <img id="lastImg" alt="">
    <div class="last-info">
      <span class="last-tag" id="lastTag">—</span>
      <div class="last-time" id="lastTime">—</div>
    </div>
    <button class="btn-undo" onclick="undoLast()">Desfazer</button>
  </div>

  <button class="btn-export" id="btnExp" onclick="doExport()" disabled>
    <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg>
    Exportar relatório
  </button>

  <button class="clear" onclick="clearAll()">Limpar sessão</button>

  <div class="status" id="status">—</div>
</div>

<input type="file" id="fileIn" accept="image/*" capture="environment">
<div class="toast" id="toast"></div>

<script>
  const STORE = 'conchas_v1';
  const state = { operator:'', photos:[] };  // photos: {id,type,ts,dataUrl}
  let pending = null;

  // --- storage (window.storage if available and working, else memory-only) ---
  let storageOK = false;
  async function probeStorage(){
    if(typeof window.storage === 'undefined' || !window.storage) return false;
    try{
      const probeKey = 'conchas_probe';
      const r = await window.storage.set(probeKey, '1', false);
      if(!r) return false;
      await window.storage.delete(probeKey, false);
      return true;
    }catch(e){ return false; }
  }

  async function storeGet(key){
    if(!storageOK) return null;
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storeSet(key,val){
    if(!storageOK) return;
    try{ await window.storage.set(key, val, false); }catch(e){}
  }
  async function storeDel(key){
    if(!storageOK) return;
    try{ await window.storage.delete(key, false); }catch(e){}
  }

  async function saveMeta(){
    const meta = { operator: state.operator, ids: state.photos.map(p=>p.id) };
    await storeSet(`${STORE}_meta`, JSON.stringify(meta));
  }
  async function savePhoto(p){
    await storeSet(`${STORE}_p_${p.id}`, JSON.stringify(p));
  }
  async function loadAll(){
    if(!storageOK) return;
    const raw = await storeGet(`${STORE}_meta`);
    if(!raw) return;
    try{
      const meta = JSON.parse(raw);
      state.operator = meta.operator || '';
      const photos = [];
      for(const id of (meta.ids || [])){
        const pr = await storeGet(`${STORE}_p_${id}`);
        if(pr){ try{ photos.push(JSON.parse(pr)); }catch(e){} }
      }
      state.photos = photos;
    }catch(e){}
  }

  // --- UI ---
  function fmtDate(d){
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}).toUpperCase();
  }
  function fmtTime(d){
    return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }
  function toast(msg, kind='ok'){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + kind;
    setTimeout(()=>t.classList.remove('show'), 2200);
  }
  function render(){
    document.getElementById('dateTop').textContent = fmtDate(new Date());
    const opEl = document.getElementById('opName');
    if(state.operator){
      opEl.textContent = state.operator;
      opEl.classList.remove('empty');
    } else {
      opEl.textContent = 'não informado';
      opEl.classList.add('empty');
    }
    const e      = state.photos.filter(p=>p.type==='esteril').length;
    const m      = state.photos.filter(p=>p.type==='minerio').length;
    const brita  = state.photos.filter(p=>p.type==='minerio'&&p.subtype==='brita').length;
    const bloco  = state.photos.filter(p=>p.type==='minerio'&&p.subtype==='bloco').length;
    document.getElementById('cE').textContent     = String(e).padStart(2,'0');
    document.getElementById('cM').textContent     = String(m).padStart(2,'0');
    document.getElementById('cBrita').textContent = brita;
    document.getElementById('cBloco').textContent = bloco;

    const last = state.photos[state.photos.length-1];
    const lastEl = document.getElementById('last');
    if(last){
      lastEl.classList.add('show');
      document.getElementById('lastImg').src = last.dataUrl;
      const tag = document.getElementById('lastTag');
      if(last.type === 'esteril'){
        tag.textContent = 'Estéril';
        tag.className = 'last-tag waste';
      } else {
        const sub = last.subtype === 'brita' ? 'Brita' : last.subtype === 'bloco' ? 'Bloco' : 'Minério';
        tag.textContent = sub;
        tag.className = 'last-tag ore';
      }
      document.getElementById('lastTime').textContent = fmtTime(new Date(last.ts));
    } else {
      lastEl.classList.remove('show');
    }

    document.getElementById('btnExp').disabled = state.photos.length === 0;
    document.getElementById('status').textContent =
      state.photos.length === 0 ? 'Nenhum registro' : `${state.photos.length} registros · aguardando export`;
  }

  // --- operator modal ---
  function editOp(){
    const html = `
      <div class="modal-bg" id="mbg" onclick="if(event.target.id==='mbg')closeModal()">
        <div class="modal">
          <div class="modal-handle"></div>
          <h2>Catador</h2>
          <input type="text" id="opIn" placeholder="Nome completo" value="${(state.operator||'').replace(/"/g,'&quot;')}" autocomplete="off">
          <div class="modal-actions">
            <button class="btn-no" onclick="closeModal()">Cancelar</button>
            <button class="btn-go" onclick="saveOp()">Confirmar</button>
          </div>
        </div>
      </div>`;
    document.body.insertAdjacentHTML('beforeend', html);
    setTimeout(()=>{ const i = document.getElementById('opIn'); if(i){ i.focus(); i.select(); } }, 120);
  }
  function closeModal(){ const m = document.getElementById('mbg'); if(m) m.remove(); }
  async function saveOp(){
    const v = document.getElementById('opIn').value.trim();
    if(v){
      state.operator = v;
      await saveMeta();
      render();
    }
    closeModal();
  }

  // --- capture ---
  function snap(type){
    if(!state.operator){
      toast('Informe o catador primeiro', 'err');
      editOp();
      return;
    }
    if(type === 'minerio'){
      openSubtypeModal();
    } else {
      pending = { type };
      document.getElementById('fileIn').click();
    }
  }

  function openSubtypeModal(){
    const html = `
      <div class="modal-bg" id="mbg" onclick="if(event.target.id==='mbg')closeModal()">
        <div class="modal">
          <div class="modal-handle"></div>
          <h2>Tipo de Minério</h2>
          <div style="display:flex;gap:12px;margin-bottom:16px">
            <button class="btn-subtype btn-brita" onclick="confirmSubtype('brita')">
              Brita
              <span class="sub-kg">1.280 kg</span>
            </button>
            <button class="btn-subtype btn-bloco" onclick="confirmSubtype('bloco')">
              Bloco
              <span class="sub-kg">1.150 kg</span>
            </button>
          </div>
          <div class="modal-actions">
            <button class="btn-no" style="flex:1;padding:14px;border:none;border-radius:10px;font-family:inherit;font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;background:var(--panel-2);color:var(--ink)" onclick="closeModal()">Cancelar</button>
          </div>
        </div>
      </div>`;
    document.body.insertAdjacentHTML('beforeend', html);
  }

  function confirmSubtype(subtype){
    closeModal();
    const peso = subtype === 'brita' ? 1280 : 1150;
    pending = { type: 'minerio', subtype, peso };
    document.getElementById('fileIn').click();
  }

  document.getElementById('fileIn').addEventListener('change', async (e)=>{
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file || !pending) return;
    try{
      const dataUrl = await compress(file);
      const photo = {
        id: Date.now(),
        type: pending.type,
        subtype: pending.subtype || null,
        peso: pending.peso || null,
        ts: new Date().toISOString(),
        dataUrl
      };
      state.photos.push(photo);
      await savePhoto(photo);
      await saveMeta();
      render();
      if(pending.type === 'esteril'){
        toast('Estéril registrado', 'ok');
      } else {
        const label = pending.subtype === 'brita' ? 'Brita (1.280 kg)' : 'Bloco (1.150 kg)';
        toast('Minério registrado · ' + label, 'ok');
      }
    }catch(err){
      console.error(err);
      toast('Erro ao processar foto', 'err');
    }
    pending = null;
  });

  function compress(file){
    return new Promise((resolve,reject)=>{
      const fr = new FileReader();
      fr.onerror = reject;
      fr.onload = (ev)=>{
        const img = new Image();
        img.onerror = reject;
        img.onload = ()=>{
          const maxDim = 900;
          let w = img.width, h = img.height;
          if(w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.55));
        };
        img.src = ev.target.result;
      };
      fr.readAsDataURL(file);
    });
  }

  async function undoLast(){
    if(state.photos.length === 0) return;
    if(!confirm('Apagar o último registro?')) return;
    const last = state.photos.pop();
    await storeDel(`${STORE}_p_${last.id}`);
    await saveMeta();
    render();
    toast('Último registro removido', 'ok');
  }

  async function clearAll(){
    if(state.photos.length === 0 && !state.operator) return;
    if(!confirm('Limpar toda a sessão (catador e fotos)?')) return;
    for(const p of state.photos){ await storeDel(`${STORE}_p_${p.id}`); }
    await storeDel(`${STORE}_meta`);
    state.operator = '';
    state.photos = [];
    render();
    toast('Sessão limpa', 'ok');
  }

  // --- export ---
  async function doExport(){
    if(state.photos.length === 0) return;
    const btn = document.getElementById('btnExp');
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = 'Gerando...';
    try{
      const wb = new ExcelJS.Workbook();
      wb.creator = 'Registro de Conchas';
      wb.created = new Date();

      const ws = wb.addWorksheet('Conchas', { views: [{ state:'frozen', ySplit:1 }] });
      ws.columns = [
        { header:'Nº',       key:'n',   width:6 },
        { header:'Tipo',     key:'t',   width:14 },
        { header:'Subtipo',  key:'s',   width:12 },
        { header:'Peso (kg)',key:'p',   width:12 },
        { header:'Data',     key:'d',   width:14 },
        { header:'Hora',     key:'h',   width:10 },
        { header:'Catador',  key:'o',   width:26 },
        { header:'Foto',     key:'f',   width:32 },
      ];
      const header = ws.getRow(1);
      header.font = { bold:true, color:{argb:'FFFFFFFF'}, size:11, name:'Calibri' };
      header.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF1A1A1A'} };
      header.alignment = { vertical:'middle', horizontal:'center' };
      header.height = 26;

      const photos = [...state.photos].sort((a,b)=> new Date(a.ts) - new Date(b.ts));

      for(let i=0; i<photos.length; i++){
        const p = photos[i];
        const d = new Date(p.ts);
        const row = ws.addRow({
          n: i+1,
          t: p.type === 'esteril' ? 'Estéril' : 'Minério',
          s: p.type === 'esteril' ? '—' : (p.subtype === 'brita' ? 'Brita' : 'Bloco'),
          p: p.type === 'esteril' ? '—' : (p.peso || (p.subtype === 'brita' ? 1280 : 1150)),
          d: d.toLocaleDateString('pt-BR'),
          h: d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }),
          o: state.operator,
          f: ''
        });
        row.height = 120;
        row.alignment = { vertical:'middle', horizontal:'left' };
        const fill = p.type === 'esteril' ? 'FFEFEFEF' : 'FFFFF1C8';
        for(let c=1; c<=8; c++){
          row.getCell(c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:fill} };
          row.getCell(c).border = {
            top:{style:'thin',color:{argb:'FFCCCCCC'}},
            bottom:{style:'thin',color:{argb:'FFCCCCCC'}},
          };
        }
        row.getCell(2).font = { bold:true };
        row.getCell(1).alignment = { vertical:'middle', horizontal:'center' };

        try{
          const b64 = p.dataUrl.split(',')[1];
          const imgId = wb.addImage({ base64: b64, extension:'jpeg' });
          ws.addImage(imgId, {
            tl: { col:7.1, row: row.number - 1 + 0.05 },
            ext: { width: 180, height: 135 }
          });
        }catch(e){}
      }

      // summary
      const sumRow = ws.addRow({});
      sumRow.height = 26;
      const countE    = photos.filter(p=>p.type==='esteril').length;
      const countBrita= photos.filter(p=>p.type==='minerio'&&p.subtype==='brita').length;
      const countBloco= photos.filter(p=>p.type==='minerio'&&p.subtype==='bloco').length;
      const pesoBrita = countBrita * 1280;
      const pesoBloco = countBloco * 1150;
      const pesoTotal = pesoBrita + pesoBloco;

      function styleSum(row, cor){
        for(let c=1;c<=8;c++){
          row.getCell(c).font={bold:true,color:{argb:'FFFFFFFF'}};
          row.getCell(c).fill={type:'pattern',pattern:'solid',fgColor:{argb:cor}};
          row.getCell(c).alignment={vertical:'middle',horizontal:'center'};
        }
        row.height=22;
      }

      // linha: Estéril
      sumRow.getCell(1).value='TOTAIS';
      sumRow.getCell(2).value='Estéril';
      sumRow.getCell(3).value='—';
      sumRow.getCell(4).value='—';
      sumRow.getCell(5).value=countE+' registros';
      sumRow.getCell(7).value=state.operator;
      styleSum(sumRow,'FF3a3a3a');

      // linha: Brita
      const britaRow = ws.addRow({});
      britaRow.getCell(1).value='';
      britaRow.getCell(2).value='Minério';
      britaRow.getCell(3).value='Brita';
      britaRow.getCell(4).value=pesoBrita+' kg';
      britaRow.getCell(5).value=countBrita+' registros';
      styleSum(britaRow,'FF7a5a0c');

      // linha: Bloco
      const blocoRow = ws.addRow({});
      blocoRow.getCell(1).value='';
      blocoRow.getCell(2).value='Minério';
      blocoRow.getCell(3).value='Bloco';
      blocoRow.getCell(4).value=pesoBloco+' kg';
      blocoRow.getCell(5).value=countBloco+' registros';
      styleSum(blocoRow,'FF2d5a1a');

      // linha: Total geral
      const totalRow = ws.addRow({});
      totalRow.getCell(1).value='TOTAL';
      totalRow.getCell(2).value=(countBrita+countBloco)+' Minério';
      totalRow.getCell(3).value=countE+' Estéril';
      totalRow.getCell(4).value=pesoTotal+' kg';
      totalRow.getCell(5).value=photos.length+' registros';
      totalRow.getCell(7).value=state.operator;
      styleSum(totalRow,'FF1A1A1A');

      // proteção da planilha (impede edição sem senha)
      await ws.protect('coleta_minerio_esteril', {
        selectLockedCells: true,
        selectUnlockedCells: true,
        formatCells: false,
        formatColumns: false,
        formatRows: false,
        insertRows: false,
        insertColumns: false,
        deleteRows: false,
        deleteColumns: false,
        sort: false,
        autoFilter: false,
      });

      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const ds = new Date().toISOString().slice(0,10);
      const safe = (state.operator || 'catador').replace(/[^a-zA-Z0-9]+/g,'_');
      a.href = url;
      a.download = `conchas_${safe}_${ds}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('Relatório exportado', 'ok');
    }catch(err){
      console.error(err);
      toast('Falha no export: ' + (err.message || err), 'err');
    }finally{
      btn.innerHTML = orig;
      btn.disabled = state.photos.length === 0;
    }
  }

  // --- init ---
  (async function(){
    storageOK = await probeStorage();
    await loadAll();
    render();
    if(!state.operator){
      setTimeout(editOp, 300);
    }
  })();
</script>
</body>
</html>
